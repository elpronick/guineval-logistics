name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Instalar dependencias del cliente
        run: npm ci
        working-directory: ./client

      - name: Compilar Frontend para producción
        run: npm run build
        working-directory: ./client

      - name: Configurar páginas de GitHub
        uses: actions/configure-pages@v5

      - name: Subir artefacto de compilación
        uses: actions/upload-pages-artifact@v3
        with:
          path: './client/dist'

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
